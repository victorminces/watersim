<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Water Contour</title>
<link rel="stylesheet" href="style.css?v=20261123101735">
</head>
<body>
<canvas id="stage"></canvas>

<div id="boot">
  <h1>Water Contour</h1>
  <p>Surface waves seen from above. The camera finds your silhouette; the water flows around it.</p>
  <button id="btn-start">Start camera</button>
  <button id="btn-demo" class="ghost">Run without camera</button>
  <p class="fine">Nothing leaves this machine &mdash; the video stays in the browser.</p>
  <p class="fine" id="boot-msg"></p>
</div>

<div id="panel" hidden>
  <div class="row head">
    <strong>Controls</strong>
    <span class="hint">H hides &middot; F fullscreen &middot; M mutes</span>
  </div>

  <div class="group">
    <label><input type="checkbox" id="obstacle" checked> Solid obstacle <span class="sub">waves reflect off the contour</span></label>
    <label><input type="checkbox" id="ripples" checked> Motion ripples <span class="sub">moving contour pushes waves out</span></label>
  </div>

  <div class="group">
    <label class="sel">Look
      <select id="look">
        <option value="0">Water only &mdash; person as void</option>
        <option value="1" selected>Camera seen through the water</option>
        <option value="2">Rippled camera &mdash; colour fringes</option>
        <option value="3">Oil slick</option>
        <option value="4">Neon contours</option>
        <option value="5">Liquid trails</option>
        <option value="6">Thermal camera</option>
        <option value="7">Caustic light</option>
      </select>
    </label>
    <label class="sl">Deform <input type="range" id="deform" min="0" max="3" step="0.05" value="1"></label>
    <label class="sl">Color cycle <input type="range" id="cycle" min="0" max="1.5" step="0.01" value="0.3"></label>
    <label class="sel">Palette
      <select id="palette"></select>
    </label>
  </div>

  <div class="group">
    <label class="sl">Wave speed <input type="range" id="speed" min="0.08" max="0.45" step="0.01" value="0.11"></label>
    <label class="sl">Wave life <input type="range" id="damp" min="0.9" max="0.999" step="0.001" value="0.92"></label>
    <label class="sl">Ripple push <input type="range" id="push" min="0" max="6" step="0.1" value="0.6"></label>
    <label class="sl">Relief <input type="range" id="relief" min="0.2" max="4" step="0.05" value="1"></label>
    <label class="sl">Refraction <input type="range" id="refract" min="0" max="0.2" step="0.005" value="0"></label>
    <label class="sl">Rain <input type="range" id="rain" min="0" max="1" step="0.02" value="0"></label>
    <label class="sl">Detail <input type="range" id="detail" min="0.4" max="2.5" step="0.1" value="1"></label>
  </div>

  <div class="group">
    <label><input type="checkbox" id="mirror" checked> Mirror the camera</label>
    <label class="sel">Framing
      <select id="framing">
        <option value="fill">Fill the screen (crops the sides)</option>
        <option value="whole">Whole picture (water margins)</option>
      </select>
    </label>
    <label><input type="checkbox" id="invert" checked> Invert mask <span class="sub">if water and body are swapped</span></label>
    <label class="sl">Edge softness <input type="range" id="soft" min="0" max="1" step="0.05" value="0.1"></label>
    <label class="sl">Mask easing <input type="range" id="ease" min="0.05" max="1" step="0.05" value="0.1"></label>
  </div>

  <div class="group">
    <label><input type="checkbox" id="sound" checked> Sound <span class="sub">the water, made to sing</span></label>
    <label class="sl">Volume <input type="range" id="volume" min="0" max="1" step="0.01" value="0.7"></label>
    <label class="sl">Water <input type="range" id="water" min="0" max="1" step="0.01" value="0.45"></label>
    <label class="sl">Slush <input type="range" id="slush" min="0" max="1" step="0.01" value="0.22"></label>
    <label class="sl">Resonators <input type="range" id="melody" min="0" max="1" step="0.01" value="0.16"></label>
    <label class="sl">Voices <input type="range" id="voices" min="1" max="4" step="1" value="3"></label>
    <label class="sl">Clarity <input type="range" id="clarity" min="8" max="150" step="1" value="150"></label>
    <label class="sel">Pitch
      <select id="pitch">
        <option value="snap">Ripple size, on the scale</option>
        <option value="glide">Ripple size, gliding</option>
        <option value="speed">Movement speed, on the scale</option>
      </select>
    </label>
    <label class="sel">Scale
      <select id="scale"></select>
    </label>
  </div>

  <div class="group">
    <label><input type="checkbox" id="showmask"> Show mask preview</label>
    <canvas id="maskview" width="160" height="90" hidden></canvas>
    <button id="btn-calm" class="ghost small">Calm the water</button>
    <div class="stat" id="stat"></div>
  </div>
</div>

<button id="btn-panel" class="ghost small" hidden>Controls</button>
<div id="toast" role="status" hidden></div>

<script type="module" src="src/main.js?v=20261123101735"></script>
</body>
</html>
