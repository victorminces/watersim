<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Water Contour</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="stage"></canvas>

<div id="boot">
  <h1>Water Contour</h1>
  <p>Surface waves seen from above. The camera finds your silhouette; the water flows around it.</p>
  <button id="btn-start">Start camera</button>
  <button id="btn-demo" class="ghost">Run without camera</button>
  <p class="fine">Nothing leaves this machine &mdash; the video stays in the browser.</p>
  <p class="fine" id="boot-msg"></p>
</div>

<div id="panel" hidden>
  <div class="row head">
    <strong>Controls</strong>
    <span class="hint">H hides &middot; F fullscreen</span>
  </div>

  <div class="group">
    <label><input type="checkbox" id="obstacle" checked> Solid obstacle <span class="sub">waves reflect off the contour</span></label>
    <label><input type="checkbox" id="ripples" checked> Motion ripples <span class="sub">moving contour pushes waves out</span></label>
  </div>

  <div class="group">
    <label class="sel">Look
      <select id="look">
        <option value="0">Water only &mdash; person as void</option>
        <option value="1">Camera seen through the water</option>
      </select>
    </label>
    <label class="sel">Palette
      <select id="palette"></select>
    </label>
  </div>

  <div class="group">
    <label class="sl">Wave speed <input type="range" id="speed" min="0.08" max="0.45" step="0.01" value="0.34"></label>
    <label class="sl">Wave life <input type="range" id="damp" min="0.9" max="0.999" step="0.001" value="0.975"></label>
    <label class="sl">Ripple push <input type="range" id="push" min="0" max="6" step="0.1" value="1.2"></label>
    <label class="sl">Relief <input type="range" id="relief" min="0.2" max="4" step="0.05" value="1"></label>
    <label class="sl">Refraction <input type="range" id="refract" min="0" max="0.2" step="0.005" value="0.06"></label>
    <label class="sl">Rain <input type="range" id="rain" min="0" max="1" step="0.02" value="0"></label>
  </div>

  <div class="group">
    <label><input type="checkbox" id="mirror" checked> Mirror the camera</label>
    <label><input type="checkbox" id="invert"> Invert mask <span class="sub">if water and body are swapped</span></label>
    <label class="sl">Edge softness <input type="range" id="soft" min="0" max="1" step="0.05" value="0.5"></label>
    <label class="sl">Mask easing <input type="range" id="ease" min="0.05" max="1" step="0.05" value="0.3"></label>
  </div>

  <div class="group">
    <label><input type="checkbox" id="showmask"> Show mask preview</label>
    <canvas id="maskview" width="160" height="90" hidden></canvas>
    <button id="btn-calm" class="ghost small">Calm the water</button>
    <div class="stat" id="stat"></div>
  </div>
</div>

<script type="module" src="src/main.js"></script>
</body>
</html>
