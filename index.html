<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Water Contour</title>
<link rel="stylesheet" href="style.css?v=20261124181715">
</head>
<body>
<canvas id="stage"></canvas>

<div id="boot">
  <h1>Water Contour</h1>
  <p>Surface waves seen from above. The camera finds your silhouette; the water flows around it.</p>
  <button id="btn-start">Start camera</button>
  <button id="btn-demo" class="ghost">Run without camera</button>
  <p class="fine">Nothing leaves this machine &mdash; the video stays in the browser.</p>
  <p class="fine" id="boot-msg"></p>
</div>

<div id="panel" hidden>
  <div class="row head">
    <strong>Controls</strong>
    <span class="hint">H hides &middot; F fullscreen &middot; M mutes</span>
  </div>

  <!-- A row shows only while it does something (see refreshControls in
       src/main.js): data-looks lists the looks it applies to, data-skies the
       skies of the sky reflection, data-pitch the pitch modes, data-needs a box
       that must be ticked, data-source the input (camera or demo).
       Sliders are continuous (step="any") unless they count something. One
       marked data-mid has its default at the middle of its travel, the bar
       bent so the region around the default gets most of it (see curveSlider
       in src/main.js); data-mid="x" puts x at the middle instead. -->

  <section class="group">
    <h2>Body</h2>
    <label><input type="checkbox" id="obstacle" checked> Solid obstacle <span class="sub">waves reflect off the contour</span></label>
    <label><input type="checkbox" id="ripples" checked> Motion ripples <span class="sub">moving contour pushes waves out</span></label>
    <label class="sl" data-needs="ripples">Ripple push <input type="range" id="push" min="0" max="6" step="any" value="0.6" data-mid></label>
    <label class="sl" data-needs="ripples">Ripple length <input type="range" id="ripplelen" min="0" max="0.25" step="any" value="0.06" data-mid></label>
  </section>

  <section class="group">
    <h2>Look</h2>
    <label class="sel">
      <select id="look" aria-label="Look">
        <option value="0">Water only &mdash; person as void</option>
        <option value="1">Camera seen through the water</option>
        <option value="2" selected>Rippled camera &mdash; colour fringes</option>
        <optgroup label="Colour over the rippled camera">
          <option value="3">Oil slick</option>
          <option value="4">Neon contours</option>
          <option value="5">Liquid trails</option>
          <option value="6">Thermal camera</option>
          <option value="7">Caustic light</option>
        </optgroup>
        <optgroup label="Natural colour over the rippled camera">
          <option value="8">Diffraction &mdash; ripples as a rainbow grating</option>
          <option value="9">Sky reflection</option>
          <option value="10">Clear water &mdash; depth and light</option>
        </optgroup>
      </select>
    </label>
    <label class="sel" data-looks="9">Sky
      <select id="sky">
        <option value="sunset">Sunset</option>
        <option value="aurora">Aurora</option>
        <option value="neon">Neon dusk</option>
        <option value="midday">Midday</option>
      </select>
    </label>
    <label class="sel" data-looks="0 1 7">Palette
      <select id="palette"></select>
    </label>
    <label class="sl" data-looks="1">Refraction <input type="range" id="refract" min="0" max="0.2" step="any" value="0"></label>
    <label class="sl" data-looks="2 3 4 5 6 7 8 9 10">Deform <input type="range" id="deform" min="0" max="3" step="any" value="0.85" data-mid></label>
    <label class="sl" data-looks="3 4 5 6 7 8 9 10">Effect <input type="range" id="fx" min="0" max="2" step="any" value="1"></label>
    <label class="sl" data-looks="3 4 5 6 7 8 9" data-skies="sunset neon midday">Color cycle <input type="range" id="cycle" min="0" max="1.5" step="any" value="0.3" data-mid></label>
    <label class="sl" data-looks="8">Grating <input type="range" id="grating" min="5" max="120" step="any" value="25" data-mid></label>
    <label class="sl" data-looks="8 9" data-skies="sunset neon midday">Light from <input type="range" id="lightaz" min="0" max="360" step="any" value="40"></label>
    <label class="sl" data-looks="9" data-skies="sunset neon midday">Sun height <input type="range" id="sunh" min="0" max="1" step="any" value="0.12" data-mid></label>
    <label class="sl" data-looks="9" data-skies="sunset midday">Clouds <input type="range" id="clouds" min="0" max="1" step="any" value="0.6"></label>
    <label class="sl" data-looks="10">Depth <input type="range" id="depth" min="0.1" max="3" step="any" value="0.6" data-mid></label>
    <label class="sl" data-looks="10">Caustics <input type="range" id="causticamt" min="0" max="3" step="any" value="1" data-mid></label>
    <label class="sl">Relief <input type="range" id="relief" min="0.2" max="4" step="any" value="1" data-mid></label>
  </section>

  <section class="group">
    <h2>Water</h2>
    <label class="sl">Wave speed <input type="range" id="speed" min="0.025" max="0.45" step="any" value="0.11" data-mid></label>
    <label class="sl">Wave life <input type="range" id="damp" min="0.9" max="0.999" step="any" value="0.92" data-mid></label>
    <label class="sl">Rain <input type="range" id="rain" min="0" max="1" step="any" value="0" data-mid="0.2"></label>
    <label class="sl">Detail <input type="range" id="detail" min="0.4" max="2.5" step="any" value="1" data-mid></label>
  </section>

  <section class="group">
    <h2>Camera</h2>
    <label><input type="checkbox" id="mirror" checked> Mirror the camera</label>
    <label class="sel" data-source="camera">Framing
      <select id="framing">
        <option value="fill">Fill the screen (crops the sides)</option>
        <option value="whole">Whole picture (water margins)</option>
      </select>
    </label>
    <label data-source="camera"><input type="checkbox" id="invert" checked> Invert mask <span class="sub">if water and body are swapped</span></label>
    <label class="sl">Edge softness <input type="range" id="soft" min="0" max="1" step="any" value="0.1" data-mid></label>
    <label class="sl">Mask easing <input type="range" id="ease" min="0.05" max="1" step="any" value="0.1" data-mid></label>
    <label data-source="camera"><input type="checkbox" id="showmask"> Show mask preview</label>
    <canvas id="maskview" width="160" height="90" hidden></canvas>
  </section>

  <section class="group">
    <h2><label><input type="checkbox" id="sound" checked> Sound <span class="sub">the water, made to sing</span></label></h2>
    <label class="sl" data-needs="sound">Volume <input type="range" id="volume" min="0" max="1" step="any" value="0.7"></label>
    <label class="sl" data-needs="sound">Water <input type="range" id="water" min="0" max="1" step="any" value="0.45"></label>
    <label class="sl" data-needs="sound">Slush <input type="range" id="slush" min="0" max="1" step="any" value="0.69"></label>
    <label class="sl" data-needs="sound">Resonators <input type="range" id="melody" min="0" max="1" step="any" value="0.19" data-mid></label>
    <label class="sl" data-needs="sound">Voices <input type="range" id="voices" min="1" max="4" step="1" value="1"></label>
    <label class="sl" data-needs="sound">Clarity <input type="range" id="clarity" min="8" max="300" step="any" value="127" data-mid></label>
    <label class="sel" data-needs="sound">Pitch
      <select id="pitch">
        <option value="snap">Ripple size, on the scale</option>
        <option value="glide">Ripple size, gliding</option>
        <option value="speed" selected>Movement speed, on the scale</option>
      </select>
    </label>
    <label class="sel" data-needs="sound" data-pitch="snap speed">Scale
      <select id="scale"></select>
    </label>
  </section>

  <div class="group">
    <button id="btn-calm" class="ghost small">Calm the water</button>
    <div class="stat" id="stat"></div>
  </div>
</div>

<button id="btn-panel" class="ghost small" hidden>Controls</button>
<div id="toast" role="status" hidden></div>

<script type="module" src="src/main.js?v=20261124181715"></script>
</body>
</html>
